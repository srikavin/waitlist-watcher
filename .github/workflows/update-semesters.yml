name: Discover semesters
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  checks: write
concurrency:
  group: semester-update
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      commit: ${{ steps.update.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: update
        run: |
          node util/update-semesters.mjs
          if ! git diff --quiet -- common/config.json firestore.indexes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add common/config.json firestore.indexes.json
            git commit -m 'Update published semesters from Testudo'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-prod.yml
    with:
      source_ref: ${{ needs.discover.outputs.commit }}
    secrets: inherit
